name: Quality Assurance

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f525247833159c03d48cf4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start static server
        run: npx --yes http-server . -p 8080 &

      - name: Wait for server
        run: sleep 3

      - name: Validate HTML
        run: npx htmlhint "**/*.html"

      - name: Lint CSS
        run: npx stylelint "assets/css/**/*.css"

      - name: Lint JavaScript
        run: npx eslint "assets/js/**/*.js"

      - name: Run Tests
        run: npm test

      - name: Check internal links
        run: npx broken-link-checker http://localhost:8080 -ro

      - name: Accessibility Check
        run: npx @axe-core/cli http://localhost:8080

      - name: Run Lighthouse CI
        run: npx lighthouse http://localhost:8080 --output=html --output-path=./report.html --chrome-flags="--headless"
